---
- name: Ensure workspace parent directory exists
  ansible.builtin.file:
    path: "{{ repo_dest | dirname }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

# Requires the target host to have SSH access to GitHub (deploy key or the
# operator's forwarded key) since obliviate-crm-tatto is a private repo.
- name: Clone/update obliviate-crm-tatto (with dify/ and twenty/ submodules)
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: "{{ repo_version }}"
    recursive: true
    accept_hostkey: true
  become: false
  register: repo_checkout
